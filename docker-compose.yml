services:
  postgres:
    image: hub.hamdocker.ir/postgres:16
    environment:
      POSTGRES_USER: mr_dan
      POSTGRES_PASSWORD: mr_dan
      POSTGRES_DB: mr_dan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: 
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mr_dan -d mr_dan"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: hub.hamdocker.ir/chromadb/chroma:latest
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/data
    networks: 
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10


services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mr_dan
      POSTGRES_PASSWORD: mr_dan
      POSTGRES_DB: mr_dan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mr_dan -d mr_dan"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql://mr_dan:mr_dan@postgres:5432/mr_dan?schema=public
      CHROMA_URL: http://chromadb:8000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      LLM_MODEL: ${LLM_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy

volumes:
  postgres-data:
  chroma-data:

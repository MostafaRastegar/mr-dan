  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     chromadb:
  #       condition: service_healthy
networks:
  app_network:
    driver: bridge

volumes:
  postgres-data:
  chroma-data:
